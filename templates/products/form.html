{% extends "base.html" %}
{% block title %}{{ "Edytuj produkt" if product else "Dodaj produkt" }} – Sklep 4TP{% endblock %}
{% block content %}
<h1>{{ "Edytuj: " ~ product.name if product else "Dodaj produkt" }}</h1>
<form method="post">
    <label>Nazwa: <input name="name" value="{{ product.name if product else '' }}" required></label><br>
    <label>Cena: <input name="price" type="number" step="0.01" min="0"
        value="{{ product.price if product else '' }}" required></label><br>
    <label>Kategoria:
        <select name="category_id">
            {% for c in categories %}
            <option value="{{ c.id }}"{% if product and product.category_id == c.id %} selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select></label><br>
    <label><input type="checkbox" name="is_available"
        {% if not product or product.is_available %}checked{% endif %}> Dostępny</label><br>
    <button>Zapisz</button>
</form>
{% endblock %}
