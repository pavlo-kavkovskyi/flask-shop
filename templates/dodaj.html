{% extends "base.html" %}
{% block tytul %}Dodaj – Sklep 4TP{% endblock %}
{% block tresc %}
<h1>Dodaj produkt</h1>
<form method="post">
    <label>Nazwa: <input name="nazwa" required></label><br>
    <label>Cena: <input name="cena" type="number" step="0.01" required></label><br>
    <label>Kategoria:
        <select name="kategoria_id">
            {% for k in kategorie %}
            <option value="{{ k.id }}">{{ k.nazwa }}</option>
            {% endfor %}
        </select></label><br>
    <label><input type="checkbox" name="dostepny" checked> Dostępny</label><br>
    <button>Dodaj</button>
</form>
{% endblock %}
