<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block tytul %}Sklep 4TP{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('lista') }}">Start</a> |
        <a href="{{ url_for('dodaj') }}">Dodaj</a>
        <form method="get" action="{{ url_for('lista') }}" class="szukaj">
            <input name="q" placeholder="Szukaj..." value="{{ q or '' }}">
            <label><input type="checkbox" name="tylko_dostepne" value="1"
                {% if tylko_dostepne %}checked{% endif %}> tylko dostępne</label>
            <button>Szukaj</button>
        </form>
    </nav>
    <main>
        {% block tresc %}{% endblock %}
    </main>
    <footer>4TP 2026</footer>
</body>
</html>
